[project]
name = "gmail-manager"
version = "0.1.0"
description = "Classify Gmail inbox mail (OTP, Primary, Transaction, Updates, Promotional) and apply existing Gmail labels"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "google-api-python-client>=2.140",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
    "system-one-adapter[openai]>=0.2",
    "typesafe-sdk>=0.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
gmail-manager = "gmail_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_manager"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
